<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitrine - Sua LANDING PAGE esta aqui</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Cópia estática do formulário de contato, só para o Netlify Forms
      reconhecer os campos no deploy. O formulário visível fica em
      src/components/ContactModal.jsx: os nomes dos campos precisam ser iguais.
    -->
    <form name="contato" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="assunto" />
      <input name="nome" />
      <input name="cidade" />
      <input name="negocio" />
      <input name="contato" />
      <textarea name="mensagem"></textarea>
      <input name="consentimento" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
